name: Java CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile application
        run: ./mvnw -B clean compile

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Package application
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar
          if-no-files-found: error

      - name: Log in to Azure
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/devops-java-app:${{ github.sha }}" \
            -t "${{ vars.ACR_LOGIN_SERVER }}/devops-java-app:latest" \
            .

      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/devops-java-app:${{ github.sha }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/devops-java-app:latest"

      - name: Connect to AKS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-devops-cia2
          cluster-name: aks-devops-cia2

      - name: Deploy application to AKS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: azure/k8s-deploy@v5
        with:
          action: deploy
          manifests: |
            k8s/deployment.yaml
            k8s/service.yaml
          images: |
            ${{ vars.ACR_LOGIN_SERVER }}/devops-java-app:${{ github.sha }}

      - name: Verify Kubernetes deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl rollout status deployment/devops-java-app --timeout=180s
          kubectl get pods
          kubectl get service devops-java-app-service
