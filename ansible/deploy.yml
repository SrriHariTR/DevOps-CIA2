---
- name: Deploy application to Azure AKS
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes deployment manifest
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ playbook_dir }}/../k8s/deployment.yaml"

    - name: Update deployment with latest CI image
      ansible.builtin.command:
        cmd: kubectl set image deployment/devops-java-app devops-java-app={{ acr_login_server }}/devops-java-app:{{ image_tag }}

    - name: Apply Kubernetes service
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ playbook_dir }}/../k8s/service.yaml"

    - name: Wait for deployment rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/devops-java-app --timeout=180s

    - name: Display deployed pods
      ansible.builtin.command:
        cmd: kubectl get pods

    - name: Display application service
      ansible.builtin.command:
        cmd: kubectl get service devops-java-app-service
