apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-app
  labels:
    app: devops-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-java-app
  template:
    metadata:
      labels:
        app: devops-java-app
    spec:
      containers:
        - name: devops-java-app
          image: devopscia2.azurecr.io/devops-java-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
